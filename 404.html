<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found · Student MD Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&family=Roboto+Slab:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="launch-polish.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f3f1; color: #1a1a1a; font-family: "Public Sans", sans-serif; }
    main { display: grid; min-height: 100vh; padding: 24px; place-items: center; }
    .not-found { width: min(720px, 100%); padding: clamp(38px, 7vw, 72px); border: 1px solid #dedfdf; border-radius: 28px; background: #fff; }
    .eyebrow { color: #007fa3; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 14px 0 16px; color: #001a70; font: 800 clamp(38px, 8vw, 68px)/1.05 "Roboto Slab", serif; }
    p { margin: 0 0 28px; font-size: 17px; line-height: 1.65; }
    a { display: inline-flex; min-height: 48px; align-items: center; padding: 12px 20px; background: #001a70; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body data-page="not-found">
  <main>
    <section class="not-found" aria-labelledby="not-found-title">
      <p class="eyebrow">404 · Page not found</p>
      <h1 id="not-found-title">This page isn't here.</h1>
      <p>The link may be out of date, or the page may have moved. Return to the guide and use search to find what you need.</p>
      <a href="index.html">Return to the guide</a>
    </section>
  </main>
</body>
</html>
